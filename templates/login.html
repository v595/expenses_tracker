<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinancePro – Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg: #060b18;
    --card: #0d1628;
    --border: #1e2d4a;
    --accent: #3b82f6;
    --accent2: #8b5cf6;
    --text: #f1f5f9;
    --muted: #64748b;
    --success: #22c55e;
    --danger: #ef4444;
    --gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 80% at 20% 20%, rgba(59,130,246,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 60% at 80% 80%, rgba(139,92,246,0.10) 0%, transparent 60%);
    pointer-events: none;
  }
  .auth-page { width: 100%; max-width: 460px; padding: 24px; position: relative; z-index: 1; }
  .brand {
    text-align: center;
    margin-bottom: 36px;
  }
  .brand-icon {
    width: 64px; height: 64px;
    background: var(--gradient);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    margin: 0 auto 16px;
    box-shadow: 0 8px 32px rgba(59,130,246,0.3);
  }
  .brand h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .brand p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.4);
  }
  .card h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .card .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .input-group { margin-bottom: 18px; }
  .input-group label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
  .input-wrap { position: relative; }
  .input-wrap i {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 14px;
  }
  .input-wrap input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px 13px 42px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s;
    outline: none;
  }
  .input-wrap input:focus { border-color: var(--accent); background: rgba(59,130,246,0.06); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .btn-primary {
    width: 100%; padding: 14px;
    background: var(--gradient);
    border: none; border-radius: 12px;
    color: white; font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(59,130,246,0.3);
    margin-top: 6px;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(59,130,246,0.4); }
  .divider { text-align: center; margin: 22px 0; position: relative; }
  .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border); }
  .divider span { background: var(--card); padding: 0 12px; color: var(--muted); font-size: 13px; position: relative; }
  .alt-link { text-align: center; font-size: 14px; color: var(--muted); }
  .alt-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .error-msg {
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5; border-radius: 10px; padding: 12px 16px;
    font-size: 13px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .demo-info {
    background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-size: 12px; color: #93c5fd;
  }
</style>
</head>
<body>
<div class="auth-page">
  <div class="brand">
    <div class="brand-icon">💰</div>
    <h1>FinancePro</h1>
    <p>Smart Expense Management</p>
  </div>
  <div class="card">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to your account to continue</p>

    {% if error %}
    <div class="error-msg"><i class="fa fa-circle-exclamation"></i> {{ error }}</div>
    {% endif %}

    <div class="demo-info">
      <i class="fa fa-info-circle"></i> New here? <a href="/signup" style="color:#93c5fd;font-weight:600;">Create a free account</a> to get started.
    </div>

    <form method="POST">
      <div class="input-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <i class="fa fa-envelope"></i>
          <input type="email" name="email" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="input-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fa fa-lock"></i>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
      </div>
      <button class="btn-primary" type="submit"><i class="fa fa-right-to-bracket"></i> &nbsp;Sign In</button>
    </form>
    <div class="divider"><span>OR</span></div>
    <div class="alt-link">Don't have an account? <a href="/signup">Sign up free</a></div>
  </div>
</div>
</body>
</html>
