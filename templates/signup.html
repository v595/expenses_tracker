<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinancePro – Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg: #060b18;
    --card: #0d1628;
    --border: #1e2d4a;
    --accent: #3b82f6;
    --accent2: #8b5cf6;
    --text: #f1f5f9;
    --muted: #64748b;
    --gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 24px;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 80% at 80% 20%, rgba(139,92,246,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 60% at 20% 80%, rgba(59,130,246,0.10) 0%, transparent 60%);
    pointer-events: none;
  }
  .auth-page { width: 100%; max-width: 500px; position: relative; z-index: 1; }
  .brand { text-align: center; margin-bottom: 28px; }
  .brand-icon {
    width: 56px; height: 56px;
    background: var(--gradient);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; margin: 0 auto 12px;
    box-shadow: 0 8px 32px rgba(139,92,246,0.3);
  }
  .brand h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .brand p { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.4);
  }
  .card h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .card .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.5px; }
  .input-wrap { position: relative; }
  .input-wrap i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
  .input-wrap input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 12px 13px 12px 38px;
    color: var(--text);
    font-family: inherit; font-size: 14px;
    transition: all 0.2s; outline: none;
  }
  .input-wrap input:focus { border-color: var(--accent2); background: rgba(139,92,246,0.06); box-shadow: 0 0 0 3px rgba(139,92,246,0.15); }
  .section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin: 20px 0 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .btn-primary {
    width: 100%; padding: 14px;
    background: var(--gradient);
    border: none; border-radius: 12px;
    color: white; font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(139,92,246,0.3);
    margin-top: 8px;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(139,92,246,0.4); }
  .alt-link { text-align: center; font-size: 14px; color: var(--muted); margin-top: 20px; }
  .alt-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .error-msg {
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5; border-radius: 10px; padding: 12px 16px;
    font-size: 13px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .tip { font-size: 11px; color: var(--muted); margin-top: 5px; }
  @media(max-width:500px){ .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="auth-page">
  <div class="brand">
    <div class="brand-icon">💰</div>
    <h1>FinancePro</h1>
    <p>Start tracking your expenses today</p>
  </div>
  <div class="card">
    <h2>Create your account</h2>
    <p class="sub">Set up your profile and budget goals</p>

    {% if error %}
    <div class="error-msg"><i class="fa fa-circle-exclamation"></i> {{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="input-group">
        <label>Full Name</label>
        <div class="input-wrap">
          <i class="fa fa-user"></i>
          <input type="text" name="name" placeholder="Rahul Sharma" required>
        </div>
      </div>
      <div class="input-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <i class="fa fa-envelope"></i>
          <input type="email" name="email" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="input-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fa fa-lock"></i>
          <input type="password" name="password" placeholder="Min 6 characters" required minlength="6">
        </div>
      </div>

      <div class="section-label">Budget Goals</div>

      <div class="row">
        <div class="input-group">
          <label>Monthly Budget (₹)</label>
          <div class="input-wrap">
            <i class="fa fa-wallet"></i>
            <input type="number" name="budget" placeholder="20000" value="20000" min="100">
          </div>
          <p class="tip">Your spending limit per month</p>
        </div>
        <div class="input-group">
          <label>Savings Goal (₹)</label>
          <div class="input-wrap">
            <i class="fa fa-piggy-bank"></i>
            <input type="number" name="savings_goal" placeholder="50000" value="50000" min="100">
          </div>
          <p class="tip">Target savings to achieve</p>
        </div>
      </div>

      <button class="btn-primary" type="submit"><i class="fa fa-user-plus"></i> &nbsp;Create Account</button>
    </form>
    <div class="alt-link">Already have an account? <a href="/login">Sign in</a></div>
  </div>
</div>
</body>
</html>
